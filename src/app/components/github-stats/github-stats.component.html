<div class="w-full mx-auto pt-6">
  <!-- GitHub Activity Card Container -->
  <div
    class="relative overflow-hidden rounded-2xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md p-6 shadow-xl hover:border-cyan-500/40 transition-all duration-300 group"
  >
    <!-- Top Header -->
    <div
      class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-5 border-b border-slate-800/60"
    >
      <div class="flex items-center gap-3">
        <div
          class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/50 text-cyan-400 group-hover:border-cyan-500/50 group-hover:shadow-[0_0_15px_rgba(6,182,212,0.2)] transition-all"
        >
          <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
            />
          </svg>
        </div>
        <div>
          <h3
            class="text-lg font-bold text-white tracking-wide flex items-center gap-2"
          >
            GitHub Activity
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-500/30"
            >
              <span
                class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse mr-1"
              ></span>
              Active
            </span>
          </h3>
          <p class="text-xs text-slate-400">&#64;{{ username }}</p>
        </div>
      </div>

      <!-- View Profile Button -->
<!-- Replace your current <a> tag with this -->
<a
  href="https://github.com/Saif-Ali-Warsi"
  target="_blank"
  rel="noopener noreferrer"
  class="inline-flex items-center gap-2 text-xs font-semibold text-cyan-400 bg-cyan-950/40 border border-cyan-500/30 px-3.5 py-2 rounded-xl hover:bg-cyan-500/10 hover:border-cyan-400/60 transition-all duration-300"
>
  <span>View GitHub Profile</span>
  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
  </svg>
</a>
    </div>

    <!-- Stats Highlight Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-5">
      <!-- Total Contributions Card -->
      <div
        class="col-span-1 p-4 rounded-xl bg-slate-800/40 border border-slate-800 flex flex-col justify-center"
      >
        <span
          class="text-xs font-medium text-slate-400 uppercase tracking-wider"
          >In the last year</span
        >
        <div class="flex items-baseline gap-2 mt-1">
          <span
            class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-white"
          >
            {{ totalContributions }}
          </span>
          <span class="text-xs text-slate-300 font-semibold"
            >contributions</span
          >
        </div>
      </div>

      <!-- Live Contribution Graph Visualizer -->
      <div
        class="col-span-1 md:col-span-2 p-3 rounded-xl bg-slate-800/30 border border-slate-800/80 flex items-center justify-center overflow-x-auto"
      >
        <img
          [src]="'https://ghchart.rshah.org/38bdf8/' + username"
          alt="Saif-Ali-Warsi GitHub Contributions Chart"
          width="650"
          height="90"
          class="w-full min-w-[300px] max-h-24 object-contain filter drop-shadow-[0_0_8px_rgba(56,189,248,0.2)]"
        />
      </div>
    </div>
  </div>
</div>
